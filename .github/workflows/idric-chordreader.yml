name: Checked Idric core and signed Android candidates
on:
  push:
    branches: [master, implementation/idric-chordreader]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checked-core-and-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IDRIS2_INC_CGS: chez
      CHEZ: ${{ github.workspace }}/deps/Idric/_/.tools/bin/scheme
      IDRIC_REPO: ${{ github.workspace }}/deps/Idric
      DEX_REPO: ${{ github.workspace }}/deps/idric-arm-thumb
      ANDROID_NDK_REPO: ${{ github.workspace }}/deps/android-NDK
      CHARCOAL_REPO: ${{ github.workspace }}/deps/charcoal
      AICI_REPO: ${{ github.workspace }}/deps/ai-ci
      CHARCOAL_ACCEPTANCE: ${{ github.workspace }}/deps/charcoal-acceptance
      ANDROID_GREASE: ${{ github.workspace }}/deps/runtime/.build/grease/bin/grease
      LUA_SOURCE: ${{ github.workspace }}/build/lua-5.4.8/src
      ANDROID_KEYSTORE: ${{ github.workspace }}/deps/signer/_/build/app/wegert-debug.keystore
      ANDROID_KEYSTORE_TYPE: PKCS12
      ANDROID_KEY_ALIAS: wegert-debug
      ANDROID_STORE_PASSWORD: wegert-debug
      ANDROID_KEY_PASSWORD: wegert-debug
      ANDROID_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: e7e03fdc896d3740c735c603b5fed792e6172d83
          path: deps/Idric
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fuego-ironworks/idric-arm-thumb
          ref: c13a6a223a24c211d090d2c88a395c134ed8d469
          path: deps/idric-arm-thumb
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 6e1c9619a96f28494ad891a32a06edfb72f3e25b
          path: deps/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 3e682fb1175beef5625dbd2418730220e49fc9bd
          path: deps/charcoal
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: dd9f41e757add6ffcf44d17c888d3faf09d6665e
          path: deps/charcoal-acceptance
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: deps/signer
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: d7402b34bbdd0c17bbc92bf3b7ea936f761b6a06
          path: deps/ai-ci
          persist-credentials: false
      - name: Bootstrap dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libgmp-dev chezscheme curl unzip zip ripgrep ffmpeg
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: deps/catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: deps/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build and verify the maintained Grease packager runtime
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/deps/runtime
          CATFOOD_JOBS: '2'
        run: sh deps/catfood/build-tools.sh
      - name: Restore exact checked frontend and library cache
        id: frontend_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: chordreader-idric-e7e03fdc896d3740c735c603b5fed792e6172d83-ubuntu24-x86_64-host-bootstrap-v1
          path: |
            deps/Idric/_/.tools
            deps/Idric/_/bootstrap-build
            deps/Idric/_/build
            deps/Idric/_/libs/*/build
      - name: Bootstrap maintained checked compiler
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        run: deps/Idric/edric bootstrap
      - name: Restore matching installed compiler API and libraries
        id: installed_api_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: chordreader-idric-api-e7e03fdc896d3740c735c603b5fed792e6172d83-ubuntu24-x86_64-v1
          path: ~/.idris2
      - name: Regenerate source-owned compiler path metadata
        run: make -C deps/Idric/_ src/IdrisPaths.idr PREFIX="$IDRIC_REPO/_/bootstrap-build"
      - name: Install compiler API and libraries
        if: steps.installed_api_cache.outputs.cache-hit != 'true'
        run: make -C deps/Idric/_ install-libs install-support install-api IDRIS2_BOOT="$IDRIC_REPO/_/build/exec/idris2"
      - name: Preserve the exact installed compiler API before consumer qualification
        if: steps.installed_api_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.installed_api_cache.outputs.cache-primary-key }}
          path: ~/.idris2
      - name: Preserve the exact compiler before consumer qualification
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend_cache.outputs.cache-primary-key }}
          path: |
            deps/Idric/_/.tools
            deps/Idric/_/bootstrap-build
            deps/Idric/_/build
            deps/Idric/_/libs/*/build
      - name: Install pinned Android inputs
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "ndk;25.2.9519653" "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch pinned foreign Lua runtime
        run: curl -fL https://www.lua.org/ftp/lua-5.4.8.tar.gz -o lua-5.4.8.tar.gz
      - name: Verify foreign runtime bytes
        run: sha256sum -c ci/lua.sha256
      - name: Extract foreign runtime
        run: mkdir -p build
      - name: Expand verified Lua source
        run: tar -xzf lua-5.4.8.tar.gz -C build
      - name: Retrieve the accepted version1001 replacement baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13079667709
          merge-multiple: true
          run-id: 41293909008
          github-token: ${{ github.token }}
          path: build/baseline
      - name: Verify exact accepted baseline APK bytes
        run: sha256sum -c ci/chordreader-baseline.sha256
      - name: Execute checked core and live cross-language comparisons
        run: make -f Makefile.idric test assets
      - name: Build ARM32 API19, ARM64 API21 and emulator platform boundaries
        run: make -f Makefile.idric native-arm32 native-arm64 native-emulator acceptance-driver
      - name: Diagnose individual Android resources
        run: ${{ env.ANDROID_GREASE }} examples/autogenerated/chordreader/diagnose-resources.grease "$ANDROID_HOME/build-tools/36.0.0/aapt2" "$GITHUB_WORKSPACE/build/android/res" "$GITHUB_WORKSPACE/build/resource-diagnostic"
      - name: Sign ARM32 development package after resource diagnosis
        run: make -f Makefile.idric package ABI=armeabi-v7a ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify ARM32 finished signer against central registry
        uses: isomorphisms/ai-ci/android-signing@d7402b34bbdd0c17bbc92bf3b7ea936f761b6a06
        with:
          apk: build/android/chordreader-armeabi-v7a.apk
          lane: test
      - name: Sign ARM64 development package
        run: make -f Makefile.idric package ABI=arm64-v8a ANDROID_MIN_SDK=21 ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify ARM64 finished signer against central registry
        uses: isomorphisms/ai-ci/android-signing@d7402b34bbdd0c17bbc92bf3b7ea936f761b6a06
        with:
          apk: build/android/chordreader-arm64-v8a.apk
          lane: test
      - name: Sign x86_64 emulator development package
        run: make -f Makefile.idric package ABI=x86_64 ANDROID_MIN_SDK=29 ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
      - name: Enable hosted emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Execute checked DEX and real application acceptance on Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 29
          arch: x86_64
          target: default
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: make -f Makefile.idric emulator-check ACCEPTANCE_NONCE=${{ github.run_id }}-api29
      - name: Execute the same signed application acceptance on Android API34
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: make -f Makefile.idric emulator-check ACCEPTANCE_NONCE=${{ github.run_id }}-api34
      - name: Retain installable candidates and checked evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chordreader-development-candidates
          if-no-files-found: error
          path: |
            build/resource-diagnostic/
            build/android/*.apk
            build/android/*.receipt.tsv
            build/exec/*.checked.anf
            build/exec/music-regressions.tsv
            build/exec/pitch-rows.tsv
            build/exec/library-fixture.txt
            build/exec/key-regressions.tsv
            build/exec/dictionary-index.sha256
            build/exec/unicode-minus-control.txt
            build/exec/codegen-error-control.txt
            build/exec/chordreader-mutant.dex
            build/managed-mutant-source/Music.idric
            build/exec/chordreader-pitch.runtime.tsv
            build/exec/managed-decoded/**
            build/exec/android-emulator.receipt.tsv
            build/exec/android-last-ui.xml
            build/exec/android-ui-dump.txt
            build/exec/android-restored.log
            build/exec/chordreader-*.png
            build/exec/art-direct.txt
            build/acceptance-run/**/*.receipt.tsv
            build/acceptance-run/**/*.png
            build/exec/chordreader-pitch.dex
            build/exec/chordreader-runner.dex
