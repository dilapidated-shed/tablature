name: Checked Idric core and signed Android candidates
on:
  push:
    branches: [master, implementation/idric-chordreader]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-core-and-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IDRIS2_INC_CGS: chez
      IDRIC_REPO: ${{ github.workspace }}/deps/Idric
      DEX_REPO: ${{ github.workspace }}/deps/idric-arm-thumb
      ANDROID_NDK_REPO: ${{ github.workspace }}/deps/android-NDK
      AICI_REPO: ${{ github.workspace }}/deps/ai-ci
      LUA_SOURCE: ${{ github.workspace }}/build/lua-5.4.8/src
      ANDROID_KEYSTORE: ${{ github.workspace }}/deps/signer/_/build/app/wegert-debug.keystore
      ANDROID_KEYSTORE_TYPE: PKCS12
      ANDROID_KEY_ALIAS: wegert-debug
      ANDROID_STORE_PASSWORD: wegert-debug
      ANDROID_KEY_PASSWORD: wegert-debug
      ANDROID_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: 28c5755d37fb868f1b9c2f5d8fab1ce2b2ada663
          path: deps/Idric
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fuego-ironworks/idric-arm-thumb
          ref: 004389155abb1650fd6687477da847eed64ffd37
          path: deps/idric-arm-thumb
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 8acc92fbf1436e0951eaa15013d7b67626b00a1e
          path: deps/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: deps/signer
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: d7402b34bbdd0c17bbc92bf3b7ea936f761b6a06
          path: deps/ai-ci
          persist-credentials: false
      - name: Bootstrap dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libgmp-dev chezscheme curl unzip zip
      - name: Bootstrap maintained checked compiler
        run: deps/Idric/edric bootstrap
      - name: Install compiler API and libraries
        run: make -C deps/Idric/_ install-libs install-support install-api IDRIS2_BOOT="$IDRIC_REPO/_/build/exec/idris2"
      - name: Install pinned Android inputs
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "ndk;25.2.9519653" "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch pinned foreign Lua runtime
        run: curl -fL https://www.lua.org/ftp/lua-5.4.8.tar.gz -o lua-5.4.8.tar.gz
      - name: Verify foreign runtime bytes
        run: sha256sum -c ci/lua.sha256
      - name: Extract foreign runtime
        run: mkdir -p build
      - name: Expand verified Lua source
        run: tar -xzf lua-5.4.8.tar.gz -C build
      - name: Execute checked core and live cross-language comparisons
        run: make -f Makefile.idric test assets
      - name: Build ARM32 API19 and ARM64 API21 platform boundaries
        run: make -f Makefile.idric native-arm32 native-arm64
      - name: Sign ARM32 development package
        run: make -f Makefile.idric package ABI=armeabi-v7a ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify ARM32 finished signer against central registry
        uses: isomorphisms/ai-ci/android-signing@d7402b34bbdd0c17bbc92bf3b7ea936f761b6a06
        with:
          apk: build/android/chordreader-armeabi-v7a.apk
          lane: test
      - name: Sign ARM64 development package
        run: make -f Makefile.idric package ABI=arm64-v8a ANDROID_MIN_SDK=21 ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify ARM64 finished signer against central registry
        uses: isomorphisms/ai-ci/android-signing@d7402b34bbdd0c17bbc92bf3b7ea936f761b6a06
        with:
          apk: build/android/chordreader-arm64-v8a.apk
          lane: test
      - name: Retain installable candidates and checked evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chordreader-development-candidates
          if-no-files-found: error
          path: |
            build/android/*.apk
            build/android/*.receipt.tsv
            build/exec/*.checked.anf
            build/exec/music-regressions.tsv
            build/exec/pitch-rows.tsv
            build/exec/library-fixture.txt
