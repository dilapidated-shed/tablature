name: GitHub songbook remote contract
on:
  push:
    branches: [feature/remote-songbook-20261105]
  pull_request:
    branches: [implementation/idric-chordreader]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install host Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.4
      - name: Check all changed Lua syntax
        run: luac5.4 -p contingency/remote.lua contingency/remote-test.lua contingency/remote-app-test.lua contingency/app.lua
      - name: Execute offline mock GitHub storage contract
        run: lua5.4 contingency/remote-test.lua && lua5.4 contingency/remote-app-test.lua

  android-arm64-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Retrieve and verify pinned Lua source
        run: |
          curl -fL https://www.lua.org/ftp/lua-5.4.8.tar.gz -o lua-5.4.8.tar.gz
          sha256sum -c ci/lua.sha256
          mkdir -p build
          tar -xzf lua-5.4.8.tar.gz -C build
      - name: Compile native C/Lua Android ARM64 boundary
        run: >-
          make -C android-native
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          LUA_SOURCE="$GITHUB_WORKSPACE/build/lua-5.4.8/src"
          TARGET=aarch64-linux-android21 ABI=arm64-v8a
      - name: Verify linked Android library
        run: test -s build/android/arm64-v8a/libchordreader.so
