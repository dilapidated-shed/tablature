name: Probe checked ChordReader parser on managed DEX

on:
  push:
    branches: [probe/managed-idric-chord-20261101, implementation/idric-chordreader]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-parser-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: e7e03fdc896d3740c735c603b5fed792e6172d83
          path: deps/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 6e1c9619a96f28494ad891a32a06edfb72f3e25b
          path: deps/android-NDK
          persist-credentials: false
      - name: Qualify pinned ICK host compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - name: Install declared frontend prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential libgmp-dev chezscheme ripgrep
      - name: Bootstrap exact checked Idriç frontend
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: deps/Idric/edric bootstrap
      - name: Install matched compiler API and rebuild canonical managed DEX driver
        env:
          IDRIS2_INC_CGS: chez
        run: |
          export IDRIS2_PREFIX="$GITHUB_WORKSPACE/deps/Idric/_/bootstrap-build"
          export IDRIS2_PACKAGE_PATH="$IDRIS2_PREFIX/idris2-0.8.0"
          export CHEZ="$GITHUB_WORKSPACE/deps/Idric/_/.tools/bin/scheme"
          export PATH="$GITHUB_WORKSPACE/deps/Idric/_/.tools/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/deps/Idric/_/build/exec/idris2_app:${LD_LIBRARY_PATH:-}"
          make -C deps/Idric/_ src/IdrisPaths.idr PREFIX="$IDRIS2_PREFIX"
          cd deps/Idric/_
          "$GITHUB_WORKSPACE/deps/Idric/_/build/exec/idris2" --install idris2api.ipkg
          cd "$GITHUB_WORKSPACE/deps/android-NDK/dex/idric"
          "$GITHUB_WORKSPACE/deps/Idric/_/build/exec/idris2" --build backend.ipkg
          cp "$GITHUB_WORKSPACE/deps/Idric/_/build/exec/idris2_app/libidris2_support.so" build/exec/idric-dex_app/
          test -s build/exec/idric-dex
      - name: Reattempt unchanged ChordReader AndroidCore and decode a successful candidate
        env:
          IDRIS2_INC_CGS: chez
        run: |
          export IDRIS2_PREFIX="$GITHUB_WORKSPACE/deps/Idric/_/bootstrap-build"
          export IDRIS2_PACKAGE_PATH="$IDRIS2_PREFIX/idris2-0.8.0"
          export IDRIS2_PATH="$GITHUB_WORKSPACE/deps/android-NDK/dex/idric/build/ttc"
          export IDRIS2_DATA="$GITHUB_WORKSPACE/deps/Idric/_/support"
          export IDRIS2_LIBS="$GITHUB_WORKSPACE/deps/Idric/_/support/c"
          export CHEZ="$GITHUB_WORKSPACE/deps/Idric/_/.tools/bin/scheme"
          export PATH="$GITHUB_WORKSPACE/deps/Idric/_/.tools/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/deps/Idric/_/build/exec/idris2_app:${LD_LIBRARY_PATH:-}"
          mkdir -p build/managed-chord-probe
          git rev-parse HEAD > build/managed-chord-probe/chordreader-head.txt
          git -C deps/android-NDK rev-parse HEAD > build/managed-chord-probe/dex-head.txt
          git -C deps/Idric rev-parse HEAD > build/managed-chord-probe/frontend-head.txt
          sha256sum examples/autogenerated/chordreader/{AndroidCore,Music}.idric > build/managed-chord-probe/source-sha256.txt
          if deps/android-NDK/dex/idric/build/exec/idric-dex --cg dex \
            --source-dir "$GITHUB_WORKSPACE/examples/autogenerated/chordreader" \
            --build-dir "$GITHUB_WORKSPACE/build/managed-chord-probe/checked-build" \
            --output-dir "$GITHUB_WORKSPACE/build/managed-chord-probe" \
            "$GITHUB_WORKSPACE/examples/autogenerated/chordreader/AndroidCore.idric" \
            -o chordreader-checked > build/managed-chord-probe/compiler.log 2>&1; then
            if ! test -s build/managed-chord-probe/chordreader-checked.dex; then
              echo 'No compiled DEX although compiler returned success' >&2
              exit 1
            fi
            sha256sum build/managed-chord-probe/chordreader-checked.dex > build/managed-chord-probe/dex-sha256.txt
            make -C deps/android-NDK/dex/idric build/oracles/baksmali-3.0.10.jar
            java -jar deps/android-NDK/dex/idric/build/oracles/baksmali-3.0.10.jar \
              disassemble build/managed-chord-probe/chordreader-checked.dex \
              -o build/managed-chord-probe/decoded
            echo 'DEX_EMISSION_AND_INDEPENDENT_DECODE=PASS' | tee build/managed-chord-probe/result.txt
            echo 'ART_EXECUTION=NOT_RUN' | tee -a build/managed-chord-probe/result.txt
            echo 'ANDROID_APP_INTEGRATION=NOT_RUN' | tee -a build/managed-chord-probe/result.txt
          else
            echo 'DEX_EMISSION=REFUSED' | tee build/managed-chord-probe/result.txt
            echo 'Old parser refusal must be compared to this actual compiler diagnostic' >&2
            cat build/managed-chord-probe/compiler.log >&2
            exit 1
          fi
      - name: Retain the exact input and actual parser result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-chord-parser-probe
          path: build/managed-chord-probe
          if-no-files-found: warn
