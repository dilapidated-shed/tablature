name: Legacy baseline history (manual comparison only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show the retained accepted baseline
        run: git show --stat 2179c276d88d91ba01642dde1a6c80a65103962f
